<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Santoria · Radio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* ==========================================================
       🌟 CHANGE YOUR BACKGROUND IMAGE HERE
       Just replace the URL inside the quotes below
       ========================================================== */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0.8rem;
      user-select: none;
      /* ⬇️⬇️⬇️ REPLACE THIS URL WITH YOUR IMAGE ⬇️⬇️⬇️ */
      background: url('https://thumbs.dreamstime.com/b/white-gold-marble-textured-background-abstract-design-k-wallpaper-white-gold-marble-textured-background-abstract-design-k-271738110.jpg') no-repeat center center fixed;
      background-size: cover;
      touch-action: manipulation;
    }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(32px) saturate(240%);
      -webkit-backdrop-filter: blur(32px) saturate(240%);
      border-radius: 2.8rem;
      padding: 2.8rem 2rem 2.8rem 2rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.12);
      position: relative;
      overflow: hidden;
    }
    #loginScreen::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 70% 30%, rgba(212, 175, 55, 0.03), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .login-content {
      position: relative;
      z-index: 2;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header .brand-icon {
      font-size: 3rem;
      color: #d4af37;
      margin-bottom: 0.5rem;
      display: block;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
    }
    .login-header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #1a2a4a;
    }
    .login-header p {
      color: #5a6a8a;
      font-size: 0.9rem;
      margin-top: 0.3rem;
      letter-spacing: 0.5px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .login-form .input-group {
      position: relative;
    }
    .login-form .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #d4af37;
      font-size: 1rem;
    }
    .login-form input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      background: #f5f0eb;
      border: 1px solid rgba(26, 42, 74, 0.08);
      border-radius: 60px;
      color: #1a2a4a;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .login-form input:focus {
      border-color: rgba(212, 175, 55, 0.2);
      background: #ffffff;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.04);
    }
    .login-form input::placeholder {
      color: #9aabbf;
      font-weight: 300;
    }
    .login-form .login-btn {
      padding: 0.9rem;
      background: #1a2a4a;
      border: none;
      border-radius: 60px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(26, 42, 74, 0.08);
      font-family: inherit;
    }
    .login-form .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 30px rgba(26, 42, 74, 0.12);
    }
    .login-form .login-btn:active {
      transform: scale(0.95);
    }
    .login-error {
      color: #d4af37;
      font-size: 0.8rem;
      text-align: center;
      min-height: 1.4rem;
      margin-top: 0.2rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .login-error.show {
      opacity: 1;
    }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.6rem;
      color: #9aabbf;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .login-footer i {
      color: #d4af37;
      margin-right: 4px;
    }

    /* ===== WELCOME OVERLAY ===== */
    #welcomeOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.6s ease;
    }
    #welcomeOverlay.show {
      display: flex;
    }
    .welcome-card {
      text-align: center;
      padding: 3rem 2.5rem;
      background: #ffffff;
      border-radius: 3rem;
      border: 1px solid rgba(212, 175, 55, 0.08);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.04);
      max-width: 500px;
      width: 90%;
    }
    .welcome-card .welcome-icon {
      font-size: 4rem;
      color: #d4af37;
      margin-bottom: 1rem;
      display: block;
    }
    .welcome-card h2 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #1a2a4a;
      margin-bottom: 0.5rem;
    }
    .welcome-card p {
      color: #5a6a8a;
      font-size: 1rem;
      letter-spacing: 0.5px;
      margin-bottom: 1.5rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .welcome-card .continue-btn {
      padding: 0.8rem 2.5rem;
      background: #1a2a4a;
      border: none;
      border-radius: 60px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(26, 42, 74, 0.08);
    }
    .welcome-card .continue-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 30px rgba(26, 42, 74, 0.12);
    }
    .welcome-card .continue-btn:active {
      transform: scale(0.95);
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== RADIO PLAYER ===== */
    #radioPage {
      display: none;
      max-width: 820px;
      width: 100%;
      animation: fadeIn 0.6s ease;
    }
    #radioPage.show {
      display: block;
    }
    .santoria-panel {
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(32px) saturate(240%);
      -webkit-backdrop-filter: blur(32px) saturate(240%);
      border-radius: 3.2rem;
      padding: 1.8rem 1.6rem 2rem 1.6rem;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(212, 175, 55, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.06);
      position: relative;
      overflow: hidden;
    }
    .santoria-panel::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 70% 30%, rgba(212, 175, 55, 0.02), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .santoria-content {
      position: relative;
      z-index: 2;
    }

    /* ===== HEADER ===== */
    .santoria-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(26, 42, 74, 0.04);
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .santoria-header .brand {
      font-weight: 500;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #1a2a4a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .santoria-header .brand i {
      font-size: 1.1rem;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.04);
      padding: 6px 8px;
      border-radius: 40px;
      border: 1px solid rgba(212, 175, 55, 0.04);
    }
    .santoria-header .user-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #f5f0eb;
      padding: 0.3rem 1rem 0.3rem 1rem;
      border-radius: 60px;
      border: 1px solid rgba(26, 42, 74, 0.04);
    }
    .santoria-header .user-info i {
      color: #d4af37;
      font-size: 0.8rem;
    }
    .santoria-header .user-info .username-display {
      color: #1a2a4a;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .santoria-header .status-badge {
      background: #f5f0eb;
      padding: 0.3rem 1rem;
      border-radius: 60px;
      font-size: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.04);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .santoria-header .status-badge i {
      font-size: 0.4rem;
      color: #d4af37;
    }

    /* ===== TRACK AREA ===== */
    .track-area {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .cover-art {
      width: 80px;
      height: 80px;
      min-width: 80px;
      background: #f5f0eb;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      color: #d4af37;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(212, 175, 55, 0.02);
      position: relative;
    }
    .cover-art::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 28px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.04), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .cover-art i {
      filter: drop-shadow(0 8px 20px rgba(212, 175, 55, 0.04));
    }
    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-info .track-name {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #1a2a4a;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist-name {
      font-size: 0.85rem;
      font-weight: 300;
      color: #5a6a8a;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist-name i {
      font-size: 0.4rem;
      color: #d4af37;
    }

    /* ===== VISUALIZER ===== */
    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 44px;
      margin: 0.4rem 0 1.2rem 0;
      background: #f5f0eb;
      border-radius: 60px;
      padding: 0.3rem 1.5rem;
      border: 1px solid rgba(212, 175, 55, 0.02);
    }
    .visualizer .bar {
      width: 5px;
      height: 16px;
      background: linear-gradient(to top, #d4af37, #f5d97a);
      border-radius: 10px;
      animation: pulseBar 1.1s infinite alternate ease-in-out;
      transform-origin: bottom;
      opacity: 0.6;
    }
    .visualizer .bar:nth-child(1) {
      animation-duration: 0.9s;
      height: 18px;
    }
    .visualizer .bar:nth-child(2) {
      animation-duration: 1.3s;
      height: 30px;
    }
    .visualizer .bar:nth-child(3) {
      animation-duration: 0.7s;
      height: 22px;
    }
    .visualizer .bar:nth-child(4) {
      animation-duration: 1.5s;
      height: 36px;
    }
    .visualizer .bar:nth-child(5) {
      animation-duration: 1.0s;
      height: 26px;
    }
    .visualizer .bar:nth-child(6) {
      animation-duration: 1.8s;
      height: 40px;
    }
    .visualizer .bar:nth-child(7) {
      animation-duration: 0.8s;
      height: 18px;
    }
    .visualizer .bar:nth-child(8) {
      animation-duration: 1.2s;
      height: 32px;
    }
    .visualizer .bar:nth-child(9) {
      animation-duration: 1.0s;
      height: 22px;
    }
    .visualizer .bar:nth-child(10) {
      animation-duration: 1.4s;
      height: 36px;
    }
    @keyframes pulseBar {
      0% {
        transform: scaleY(0.2);
        opacity: 0.3;
      }
      100% {
        transform: scaleY(1);
        opacity: 0.9;
      }
    }

    /* ===== PROGRESS ===== */
    .progress-container {
      margin: 0.8rem 0 0.3rem 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(26, 42, 74, 0.04);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      touch-action: none;
      transition: height 0.15s ease;
    }
    .progress-bar:hover {
      height: 6px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #d4af37, #f5d97a);
      border-radius: 10px;
      transition: width 0.1s linear;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.08);
    }
    .time-display {
      font-size: 0.65rem;
      color: #9aabbf;
      font-weight: 400;
      letter-spacing: 0.5px;
      min-width: 60px;
      text-align: center;
    }

    /* ===== CONTROLS ===== */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin: 1.4rem 0 0.2rem 0;
    }
    .controls button {
      background: #f5f0eb;
      border: 1px solid rgba(26, 42, 74, 0.02);
      color: #1a2a4a;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .controls button::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      padding: 1px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.02), transparent 70%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .controls button:hover {
      background: #ffffff;
      border-color: rgba(212, 175, 55, 0.04);
      color: #1a2a4a;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }
    .controls button:active {
      transform: scale(0.88);
      background: #f5f0eb;
    }
    .controls button.play-btn {
      background: #1a2a4a;
      border-color: rgba(26, 42, 74, 0.04);
      color: #ffffff;
      width: 68px;
      height: 68px;
      font-size: 1.8rem;
      box-shadow: 0 4px 20px rgba(26, 42, 74, 0.08);
    }
    .controls button.play-btn::before {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.02), transparent 70%);
    }
    .controls button.play-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 30px rgba(26, 42, 74, 0.12);
    }
    .controls button.play-btn:active {
      transform: scale(0.88);
    }
    .controls button.active {
      color: #d4af37;
      border-color: rgba(212, 175, 55, 0.04);
      background: rgba(212, 175, 55, 0.02);
    }
    .controls button.active::before {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.04), transparent 70%);
    }

    /* ===== VOLUME ===== */
    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.8rem;
      padding: 0.3rem 1rem;
      background: #f5f0eb;
      border-radius: 60px;
      border: 1px solid rgba(26, 42, 74, 0.02);
    }
    .volume-container i {
      color: #9aabbf;
      font-size: 0.8rem;
    }
    .volume-container input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      background: rgba(26, 42, 74, 0.04);
      border-radius: 10px;
      outline: none;
      transition: background 0.2s;
    }
    .volume-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5d97a, #d4af37);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.02);
    }
    .volume-container input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d4af37;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.02);
    }
    .volume-container #muteBtn {
      background: none;
      border: none;
      color: #9aabbf;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .volume-container #muteBtn:hover {
      color: #d4af37;
      background: rgba(212, 175, 55, 0.02);
    }
    .volume-container #muteBtn:active {
      transform: scale(0.85);
    }

    /* ===== FOOTER ===== */
    .santoria-footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.5rem;
      letter-spacing: 1.2px;
      color: #9aabbf;
      border-top: 1px solid rgba(26, 42, 74, 0.02);
      padding-top: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      text-transform: uppercase;
      flex-wrap: wrap;
    }
    .santoria-footer span i {
      margin-right: 4px;
      color: #d4af37;
      font-size: 0.45rem;
    }
    ::selection {
      background: transparent;
    }
    ::-moz-selection {
      background: transparent;
    }
    audio {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
      position: absolute !important;
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 600px) {
      .santoria-panel {
        padding: 2.8rem 2.6rem 2.6rem 2.6rem;
        border-radius: 4.2rem;
      }
      .cover-art {
        width: 120px;
        height: 120px;
        min-width: 120px;
        font-size: 3.6rem;
      }
      .track-info .track-name {
        font-size: 2.2rem;
        white-space: normal;
      }
      .track-info .artist-name {
        font-size: 1rem;
        white-space: normal;
      }
      .controls button {
        width: 58px;
        height: 58px;
        font-size: 1.4rem;
      }
      .controls button.play-btn {
        width: 78px;
        height: 78px;
        font-size: 2.2rem;
      }
      .volume-container input[type="range"] {
        width: 140px;
      }
      .santoria-header .brand {
        font-size: 1.6rem;
      }
      .santoria-header .user-info .username-display {
        font-size: 1rem;
      }
      .santoria-header .status-badge {
        font-size: 0.65rem;
        padding: 0.4rem 1.4rem;
      }
      .visualizer {
        height: 56px;
        gap: 6px;
      }
      .visualizer .bar {
        width: 6px;
        height: 18px;
      }
      .visualizer .bar:nth-child(1) {
        height: 22px;
      }
      .visualizer .bar:nth-child(2) {
        height: 36px;
      }
      .visualizer .bar:nth-child(3) {
        height: 28px;
      }
      .visualizer .bar:nth-child(4) {
        height: 44px;
      }
      .visualizer .bar:nth-child(5) {
        height: 30px;
      }
      .visualizer .bar:nth-child(6) {
        height: 48px;
      }
      .visualizer .bar:nth-child(7) {
        height: 20px;
      }
      .visualizer .bar:nth-child(8) {
        height: 38px;
      }
      .visualizer .bar:nth-child(9) {
        height: 26px;
      }
      .visualizer .bar:nth-child(10) {
        height: 42px;
      }

      // ==========================================================
      // EMAIL NOTIFICATION
      // ==========================================================
      function sendLoginNotification(user) {
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'

        });

        };

      // ==========================================================

      // ==========================================================
      // ⬇️⬇️⬇️ REPLACE WITH YOUR ACTUAL GOOGLE APPS SCRIPT URL ⬇️⬇️⬇️
      const GOOGLE_SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw8etCjYFMh1NnrwqaPTCnNsphb4R72xmI77wLFTfMtSdb1rA_U1sjcYRn4ocgT0gjQ8A/exec';

      // Store login timestamp for session duration
      let loginTimestamp = null;
      let logoutTracked = false;

      function trackLogin(user) {
        const now = new Date();
        loginTimestamp = now;
        
        const data = {
          username: user.username,
          date: now.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }),
          time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }),
          day: now.toLocaleDateString('en-US', { weekday: 'long' }),
          action: 'LOGIN',
          duration: '',
          timestamp: now.toISOString()
        };

        sendToSheets(data);
        console.log('📊 LOGIN tracked:', data);
      }

      function trackLogout(user) {
        const now = new Date();
        
        let duration = '';
        if (loginTimestamp) {
          const diffMs = now - loginTimestamp;
          const diffMin = Math.floor(diffMs / 60000);
          duration = diffMin + ' minutes';
        }

        const data = {
          username: user.username,
          date: now.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }),
          time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }),
          day: now.toLocaleDateString('en-US', { weekday: 'long' }),
          action: 'LOGOUT',
          duration: duration,
          timestamp: now.toISOString()
        };

        sendToSheets(data);
        console.log('📊 LOGOUT tracked:', data);
      }

      function sendToSheets(data) {

          return;

        fetch(GOOGLE_SHEETS_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        }).catch(error => {
          console.log('📊 Tracking error:', error);
        });
      }

      // ==========================================================

      // ==========================================================

      window.addEventListener('beforeunload', function() {

          if (loginTimestamp) {

      // ==========================================================
      // RADIO FUNCTIONS

      function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      function getTrackIndex(index) {
        if (isShuffled && shuffleQueue.length > 0) {
          return shuffleQueue[index];
        }
        return index;
      }

      function loadTrack(index) {
        if (isLoading) return;
        isLoading = true;
        isEnded = false;

        if (index >= playlist.length) {
          index = 0;
        }
        if (index < 0) {
          index = playlist.length - 1;
        }

        currentTrackIndex = index;
        const actualIndex = getTrackIndex(index);
        const track = playlist[actualIndex];
        if (!track) {
          isLoading = false;
          return;
        }

        trackNameEl.textContent = track.name;
        artistNameEl.textContent = track.artist;
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';
        updateStatusBadge();

        if (preloadedAudio[actualIndex]) {
          audio.src = preloadedAudio[actualIndex].src;
          if (preloadedAudio[actualIndex].duration) {
            totalTimeEl.textContent = formatTime(preloadedAudio[actualIndex].duration);
          }
        } else {
          audio.src = track.src;
        }

        audio.load();
        audio.addEventListener('loadedmetadata', function onMetadata() {
          totalTimeEl.textContent = formatTime(audio.duration);
          audio.removeEventListener('loadedmetadata', onMetadata);
          isLoading = false;
        });

        if (loadTimeout) clearTimeout(loadTimeout);
        loadTimeout = setTimeout(() => {
          isLoading = false;
          if (!audio.duration) {
            totalTimeEl.textContent = '0:00';
          }
        }, 5000);

        updateStatusBadge();
      }

      function getCurrentTrack() {
        const actualIndex = getTrackIndex(currentTrackIndex);
        return playlist[actualIndex];
      }

      function updateStatusBadge() {
        const track = getCurrentTrack();
        if (track) {
          statusBadge.innerHTML = `<i class="fas fa-circle"></i> ${track.name} · radio`;
        }
      }

      function togglePlay() {
        if (playlist.length === 0) return;
        if (audio.paused) {
          if (!audio.src || audio.ended) {
            if (isShuffled && shuffleQueue.length === 0) generateShuffleQueue();
            if (isEnded) {
              currentTrackIndex = 0;
              isEnded = false;
            }
            loadTrack(currentTrackIndex);
            setTimeout(() => {
              audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playBtn.style.color = '#ffffff';

            audio.play().then(() => {
              isPlaying = true;
              playBtn.innerHTML = '<i class="fas fa-pause"></i>';
              playBtn.style.color = '#ffffff';

          audio.pause();
          isPlaying = false;
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
          playBtn.style.color = '#ffffff';
        }
      }

      function playNext() {
        if (playlist.length === 0 || isLoading) return;
        let nextIndex = currentTrackIndex + 1;
        if (nextIndex >= playlist.length) {
          nextIndex = 0;
        }
        currentTrackIndex = nextIndex;
        isEnded = false;
        loadTrack(currentTrackIndex);
        if (isPlaying || !audio.paused) {
          setTimeout(() => {
            audio.play().catch(() => {});
          }, 300);
        }
      }

      function playPrev() {
        if (playlist.length === 0 || isLoading) return;
        let prevIndex = currentTrackIndex - 1;
        if (prevIndex < 0) {
          prevIndex = playlist.length - 1;
        }
        currentTrackIndex = prevIndex;
        isEnded = false;
        loadTrack(currentTrackIndex);
        if (isPlaying || !audio.paused) {
          setTimeout(() => {
            audio.play().catch(() => {});
          }, 300);
        }
      }

      function generateShuffleQueue() {
        shuffleQueue = playlist.map((_, i) => i);
        for (let i = shuffleQueue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffleQueue[i], shuffleQueue[j]] = [shuffleQueue[j], shuffleQueue[i]];
        }
        shuffleIndex = 0;
      }

      function toggleShuffle() {
        isShuffled = !isShuffled;
        shuffleBtn.classList.toggle('active', isShuffled);
        if (isShuffled) {
          generateShuffleQueue();
          currentTrackIndex = 0;
          isEnded = false;
          loadTrack(0);
        } else {
          currentTrackIndex = 0;
          isEnded = false;
          loadTrack(0);
        }
        if (isPlaying) {
          setTimeout(() => {
            audio.play().catch(() => {});
          }, 300);
        }
      }

      function toggleLoop() {
        const modes = ['none', 'all', 'one'];
        const currentIndex = modes.indexOf(loopMode);
        loopMode = modes[(currentIndex + 1) % modes.length];
        switch (loopMode) {
          case 'none':
            loopBtn.innerHTML = '<i class="fas fa-repeat"></i>';
            loopBtn.style.color = '#9aabbf';
            loopBtn.classList.remove('active');
            break;
          case 'all':
            loopBtn.innerHTML = '<i class="fas fa-repeat"></i>';
            loopBtn.style.color = '#d4af37';
            loopBtn.classList.add('active');
            break;
          case 'one':
            loopBtn.innerHTML = '<i class="fas fa-repeat-1"></i>';
            loopBtn.style.color = '#d4af37';
            loopBtn.classList.add('active');
            break;
        }
      }

      function updateProgress() {
        if (audio.duration && !isNaN(audio.duration)) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = percent + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
          if (totalTimeEl.textContent === '0:00') {
            totalTimeEl.textContent = formatTime(audio.duration);
          }
        }
      }

      function seek(e) {
        const rect = progressBar.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = x * audio.duration;
      }

      function setVolume(value) {
        audio.volume = parseFloat(value);
        volumeSlider.value = value;
        updateMuteIcon();
      }

      function updateMuteIcon() {
        const vol = audio.volume;
        const muted = audio.muted;
        if (muted || vol === 0) muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        else if (vol < 0.5) muteBtn.innerHTML = '<i class="fas fa-volume-low"></i>';
        else muteBtn.innerHTML = '<i class="fas fa-volume-high"></i>';
      }

      function toggleMute() {
        audio.muted = !audio.muted;
        updateMuteIcon();
      }

      // ==========================================================
      // EVENT LISTENERS
      // ==========================================================
      playBtn.addEventListener('click', e => { e.preventDefault(); togglePlay(); });
      nextBtn.addEventListener('click', e => { e.preventDefault(); playNext(); });
      prevBtn.addEventListener('click', e => { e.preventDefault(); playPrev(); });
      shuffleBtn.addEventListener('click', e => { e.preventDefault(); toggleShuffle(); });
      loopBtn.addEventListener('click', e => { e.preventDefault(); toggleLoop(); });
      muteBtn.addEventListener('click', e => { e.preventDefault(); toggleMute(); });
      volumeSlider.addEventListener('input', e => setVolume(e.target.value));
      progressBar.addEventListener('click', seek);
      audio.addEventListener('timeupdate', updateProgress);

      // ==========================================================
      // ENDED EVENT
      // ==========================================================
      audio.addEventListener('ended', function() {
        isEnded = true;

        if (loopMode === 'one') {
          audio.currentTime = 0;
          audio.play().catch(() => {});
          return;
        }

        let nextIndex = currentTrackIndex + 1;
        if (nextIndex >= playlist.length) {
          if (loopMode === 'all') {
            nextIndex = 0;
          } else {
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            playBtn.style.color = '#ffffff';
            return;
          }
        }

        currentTrackIndex = nextIndex;
        isEnded = false;
        loadTrack(currentTrackIndex);

        setTimeout(() => {
          audio.play().then(() => {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            playBtn.style.color = '#ffffff';
          }).catch(() => {});
        }, 300);
      });

      // ==========================================================
      // KEYBOARD SHORTCUTS
      // ==========================================================
      document.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); return false; }, true);

      document.addEventListener('keydown', function(e) {
        if (!radioPage.classList.contains('show')) return;

        if (e.key === ' ' || e.key === 'Space' || e.key === 'MediaPlayPause') {
          e.preventDefault();
          e.stopPropagation();
          togglePlay();
          return false;
        }
        if (e.key === 'ArrowRight' || e.key === 'MediaTrackNext') {
          e.preventDefault();
          e.stopPropagation();
          playNext();
          return false;
        }
        if (e.key === 'ArrowLeft' || e.key === 'MediaTrackPrevious') {
          e.preventDefault();
          e.stopPropagation();
          playPrev();
          return false;
        }
        if (e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          e.stopPropagation();
          toggleMute();
          return false;
        }
      }, true);

      // ==========================================================
      // INIT
      // ==========================================================
      if (playlist.length > 0) { loadTrack(0); setVolume(0.8); }

      console.log('✅ Santoria Radio · Login system ready with ' + users.length + ' users.');
      console.log('✅ Santoria Radio · Playlist loaded with ' + playlist.length + ' songs.');
      console.log('📧 Email notifications will be sent to: www.edofarhad5@gmail.com');
      console.log('📊 Login tracking enabled!');
      console.log('⌨️  Keyboard shortcuts: Space=Play/Pause, ArrowLeft=Previous, ArrowRight=Next, M=Mute');

    })();
  </script>
